name: Update validated NRB data mirror

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lcnrb-data-mirror
  cancel-in-progress: false

jobs:
  update-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload
          needs: check

      - name: Prepare data-cache worktree
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin data-cache >/dev/null 2>&1; then
            git fetch origin data-cache
            git worktree add mirror-output FETCH_HEAD
            git -C mirror-output checkout -B data-cache
          else
            git worktree add --detach mirror-output
            git -C mirror-output checkout --orphan data-cache
          fi

      - name: Download, parse, validate, and stage current NRB workbooks
        run: Rscript data-raw/update-mirror.R mirror-output

      - name: Publish only a fully validated mirror
        shell: bash
        run: |
          git -C mirror-output config user.name "lcNRB data mirror bot"
          git -C mirror-output config user.email "actions@users.noreply.github.com"
          git -C mirror-output add README.md manifest.csv data
          if git -C mirror-output diff --cached --quiet; then
            echo "Validated mirror is already current."
            exit 0
          fi
          git -C mirror-output commit -m "data: refresh validated NRB mirror"
          git -C mirror-output push origin HEAD:data-cache
