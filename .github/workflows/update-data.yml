name: Update NRB data

on:
  workflow_dispatch:
  schedule:
    # 09:00 Nepal Time (UTC+05:45) every Monday.
    - cron: "15 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lcnrb-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check
      - name: Install lcNRB
        run: R CMD INSTALL .
      - name: Download, parse, and compare vintages
        run: Rscript data-raw/build_datasets.R
      - name: Validate tracked processed data
        run: Rscript data-raw/validate_datasets.R
      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/nrb-data-update
          delete-branch: true
          commit-message: "data: update verified NRB vintages"
          title: "Automated NRB data update"
          body: |
            This pull request was generated by the weekly lcNRB update workflow.
            It contains only source vintages that passed the registered parser
            and `lc_validate()`. Review `data-raw/change-report.md` before merge.
          labels: data-update
